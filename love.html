<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Messages — Notes Under Starlight</title>
<meta name="description" content="A small collection of love notes, one at a time. Save the ones that feel like yours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #0d1120;
    --night-soft: #141a30;
    --paper: #f4ecd8;
    --paper-shadow: #d9cdae;
    --gold: #d3a95f;
    --rose: #d98a86;
    --ink: #2b2416;
    --star: #f4ecd8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse 120% 80% at 50% -10%, #1b2242 0%, var(--night) 55%, #07081200 100%), var(--night);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute;
    background:var(--star);
    border-radius:50%;
    opacity:.6;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.85;}
  }
  header{
    position:relative; z-index:2;
    text-align:center;
    padding:28px 20px 10px;
  }
  .brand{
    font-family:'Cormorant Garamond',serif;
    font-size:15px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .brand span{color:var(--rose);}
  .sub{
    font-family:'Caveat',cursive;
    font-size:18px;
    color:var(--paper);
    opacity:.6;
    margin-top:4px;
  }

  main{
    position:relative; z-index:2;
    height:calc(100svh - 190px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 24px;
  }

  .stack{
    position:relative;
    width:100%;
    max-width:380px;
    height:min(62vh, 460px);
  }

  .card{
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(transparent 0 27px, rgba(43,36,22,.05) 27px 28px),
      var(--paper);
    color:var(--ink);
    border-radius:3px 14px 6px 16px / 14px 4px 16px 3px;
    box-shadow:0 30px 60px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.15) inset;
    padding:38px 30px 30px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:transform .45s cubic-bezier(.22,.68,.36,1), opacity .45s ease;
    touch-action:pan-y;
    cursor:grab;
  }
  .card::before{
    content:"";
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:56px; height:16px;
    background:rgba(211,169,95,.35);
    border:1px solid rgba(211,169,95,.5);
  }
  .card.dragging{transition:none; cursor:grabbing;}

  .quote-text{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(20px,5.4vw,26px);
    line-height:1.5;
    color:var(--ink);
  }
  .quote-num{
    font-family:'Caveat',cursive;
    font-size:15px;
    color:#7a6a45;
    margin-top:18px;
  }

  .card-tools{
    position:absolute;
    bottom:-54px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:18px;
  }

  .stack .card:nth-child(1){z-index:3;}
  .stack .card:nth-child(2){z-index:2; transform:scale(.95) translateY(10px); opacity:.7;}
  .stack .card:nth-child(3){z-index:1; transform:scale(.9) translateY(20px); opacity:.4;}

  .tool-btn{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid rgba(244,236,216,.25);
    background:rgba(20,26,48,.7);
    backdrop-filter:blur(6px);
    color:var(--paper);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .2s ease, transform .15s ease;
  }
  .tool-btn:hover{border-color:var(--gold);}
  .tool-btn:active{transform:scale(.92);}
  .tool-btn.liked{color:var(--rose); border-color:var(--rose);}

  .arrows{
    position:relative; z-index:2;
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:78px;
  }
  .nav-btn{
    background:none; border:none;
    color:var(--paper);
    opacity:.55;
    font-size:26px;
    cursor:pointer;
    padding:10px 18px;
    transition:opacity .2s ease, transform .15s ease;
  }
  .nav-btn:hover{opacity:1;}
  .nav-btn:active{transform:scale(.9);}

  footer{
    position:relative; z-index:2;
    text-align:center;
    padding:14px 20px 24px;
  }
  .dots{
    display:flex; justify-content:center; gap:6px; margin-bottom:10px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:rgba(244,236,216,.25);
    transition:background .2s ease, width .2s ease;
  }
  .dot.active{background:var(--gold); width:18px; border-radius:3px;}

  .hint{
    font-family:'Caveat',cursive;
    font-size:15px;
    color:var(--paper);
    opacity:.4;
  }

  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--night-soft);
    border:1px solid rgba(211,169,95,.4);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:12px 20px;
    border-radius:30px;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .star{animation:none;}
    .card{transition:none;}
  }
</style>
</head>
<body>

        <button data-lang="en" onclick="setLanguage('en')" style="display:block; width:100%; background:transparent; border:none; color:var(--paper); font-size:13px; text-align:left; padding:10px 14px; cursor:pointer;">English</button>

        <button data-lang="fr" onclick="setLanguage('fr')" style="display:block; width:100%; background:transparent; border:none; color:var(--paper); font-size:13px; text-align:left; padding:10px 14px; cursor:pointer;">Français</button>
      </div>
    </div>
  </div>
  <div class="brand"><a href="./index.html" style="text-decoration:none; color:inherit;">Love<span>&nbsp;Messages</span></a></div>
  <div class="sub" id="subText">one note at a time, from me to you</div>
  <a href="./index.html" id="backLink" style="display:inline-block; margin-top:10px; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); text-decoration:none; border-bottom:1px solid rgba(211,169,95,.4); padding-bottom:2px;">← Back to Solid22</a>
</header>

<main>
  <div class="stack" id="stack"></div>
</main>

<div class="arrows">
  <button class="nav-btn" id="prevBtn" aria-label="Previous note">‹</button>
  <button class="nav-btn" id="nextBtn" aria-label="Next note">›</button>
</div>

<footer>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hintText">swipe, or tap the arrows</div>
  <a href="https://solid22-shop.fourthwall.com" target="_blank" rel="noopener" id="shopLink" style="display:inline-block; margin-top:14px; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); text-decoration:none; border-bottom:1px solid rgba(211,169,95,.4); padding-bottom:2px;">Shop the drop ↗</a>
</footer>

<div class="toast" id="toast"></div>

  let currentLang = 'en';
  let quotes = translations.en.quotes;

  function toggleLangMenu(){
    const menu = document.getElementById('langMenu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }
  document.addEventListener('click', (e) => {
    const wrap = document.getElementById('langSwitch');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('langMenu').style.display = 'none';
    }
  });

  function setLanguage(lang){
    currentLang = lang;
    quotes = translations[lang].quotes;
    document.getElementById('subText').textContent = translations[lang].subText;
    document.getElementById('backLink').textContent = translations[lang].backLink;
    document.getElementById('hintText').textContent = translations[lang].hintText;
    document.getElementById('shopLink').textContent = translations[lang].shopLink;
    document.getElementById('langBtnLabel').textContent = lang.toUpperCase();
    document.getElementById('langMenu').style.display = 'none';
    document.documentElement.lang = lang;
    current = 0;
    render();
  }

  let current = 0;
  let liked = new Set(JSON.parse(localStorage.getItem('lm_liked') || '[]'));

  const stack = document.getElementById('stack');
  const dotsWrap = document.getElementById('dots');
  const toast = document.getElementById('toast');

  function buildStars(){
    const wrap = document.getElementById('stars');
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 70; i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2 + 1;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.top = Math.random() * 100 + '%';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 4) + 's';
      frag.appendChild(s);
    }
    wrap.appendChild(frag);
  }

  function buildDots(){
    dotsWrap.innerHTML = '';
    quotes.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      dotsWrap.appendChild(d);
    });
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function toggleLike(index){
    if (liked.has(index)) liked.delete(index);
    else liked.add(index);
    localStorage.setItem('lm_liked', JSON.stringify([...liked]));
    render();
  }

  function shareCard(index){
    const text = '"' + quotes[index] + '"' + translations[currentLang].shareSuffix;
    if (navigator.share){
      navigator.share({ text }).catch(() => {});
    } else if (navigator.clipboard){
      navigator.clipboard.writeText(text);
      showToast(translations[currentLang].toastCopied);
    }
  }

  function goTo(index){
    current = ((index % quotes.length) + quotes.length) % quotes.length;
    render();
  }

  function render(){
    stack.innerHTML = '';
    buildDots();

    // Render current + next two, stacked
    for (let depth = 0; depth < 3; depth++){
      const idx = (current + depth) % quotes.length;
      const card = document.createElement('div');
      card.className = 'card';

      const q = document.createElement('p');
      q.className = 'quote-text';
      q.textContent = '"' + quotes[idx] + '"';

      const num = document.createElement('div');
      num.className = 'quote-num';
      num.textContent = translations[currentLang].noteLabel + ' ' + (idx + 1) + ' ' + translations[currentLang].ofLabel + ' ' + quotes.length;

      const top = document.createElement('div');
      top.appendChild(q);

      const bottom = document.createElement('div');
      bottom.appendChild(num);

      card.appendChild(top);
      card.appendChild(bottom);

      if (depth === 0){
        const tools = document.createElement('div');
        tools.className = 'card-tools';

        const likeBtn = document.createElement('button');
        likeBtn.className = 'tool-btn' + (liked.has(idx) ? ' liked' : '');
        likeBtn.innerHTML = liked.has(idx) ? '♥' : '♡';
        likeBtn.setAttribute('aria-label', translations[currentLang].likeLabel);
        likeBtn.onclick = (e) => { e.stopPropagation(); toggleLike(idx); };

        const shareBtn = document.createElement('button');
        shareBtn.className = 'tool-btn';
        shareBtn.innerHTML = '↗';
        shareBtn.setAttribute('aria-label', translations[currentLang].shareLabel);
        shareBtn.onclick = (e) => { e.stopPropagation(); shareCard(idx); };

        tools.appendChild(likeBtn);
        tools.appendChild(shareBtn);
        card.appendChild(tools);

        attachSwipe(card);
      }

      stack.appendChild(card);
    }
  }

  function attachSwipe(card){
    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;

    function onStart(x, y){
      dragging = true;
      startX = x; startY = y;
      card.classList.add('dragging');
    }
    function onMove(x, y){
      if (!dragging) return;
      dx = x - startX;
      dy = y - startY;
      card.style.transform = `translate(${dx}px, ${dy * 0.2}px) rotate(${dx * 0.04}deg)`;
    }
    function onEnd(){
      if (!dragging) return;
      dragging = false;
      card.classList.remove('dragging');
      if (Math.abs(dx) > 90){
        card.style.transition = 'transform .35s ease, opacity .35s ease';
        card.style.transform = `translate(${dx > 0 ? 600 : -600}px, ${dy * 0.3}px) rotate(${dx * 0.08}deg)`;
        card.style.opacity = '0';
        setTimeout(() => goTo(current + (dx > 0 ? -1 : 1)), 200);
      } else {
        card.style.transform = '';
      }
      dx = 0; dy = 0;
    }

    card.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      onStart(t.clientX, t.clientY);
    }, { passive: true });
    card.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      onMove(t.clientX, t.clientY);
    }, { passive: true });
    card.addEventListener('touchend', onEnd);

    card.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onEnd);
  }

  document.getElementById('prevBtn').onclick = () => goTo(current - 1);
  document.getElementById('nextBtn').onclick = () => goTo(current + 1);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  buildStars();
  render();
</script>
</body>
</html>
